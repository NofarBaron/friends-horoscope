name: Daily horoscope

on:
  schedule:
    - cron: "52 3 * * *"   # ~07:00 Israel time (06:00 in winter)
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:
    paths: ["friends.json", "scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-he

      - run: pip install -r requirements.txt

      - run: python scripts/update.py

      - name: Commit data.json
        run: |
          git config user.name "horoscope-bot"
          git config user.email "horoscope-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Daily horoscope $(date -u +%F)"
          git push
